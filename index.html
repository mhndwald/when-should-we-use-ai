/* Plan: portrait phone quiz, one dark world. Gray = right, red = wrong, white = neutral actions. The architect character carries the jokes. */
:root{
  --bg:#151517;
  --card:#1D1D20;
  --line:#2E2E32;
  --text:#F5F5F7;
  --muted:#A1A1A6;
  --gray:#6E6E74;
  --red:#ba0200;
  --font:'Cairo',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(#1b1b1d 1px,transparent 1px),linear-gradient(90deg,#1b1b1d 1px,transparent 1px);
  background-size:14px 14px;
  color:var(--text);font-family:var(--font);font-size:17px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:max(20px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.screen{display:none;flex:1;flex-direction:column;gap:18px}
.screen.on{display:flex}
h1{font-size:34px;font-weight:800;line-height:1.1;text-wrap:balance}
h2{font-size:26px;font-weight:800;line-height:1.2;text-wrap:balance}
.muted{color:var(--muted)}
.btn{width:100%;min-height:58px;border-radius:16px;border:0;background:var(--text);color:var(--bg);font-size:19px;font-weight:800;transition:transform .12s}
.btn:active{transform:scale(.97)}

/* character */
.bot{--s:.27;width:calc(561px*var(--s));height:calc(664px*var(--s));margin:0 auto;flex:none;position:relative}
#quizBot,#resBot{--s:.17}
.bot .go{position:absolute;inset:0}
.bot .stage{position:absolute;left:0;top:0;width:561px;height:664px;transform:scale(var(--s));transform-origin:0 0}
.bot .shadow{position:absolute;left:150px;top:640px;width:260px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(5px)}
.bot .L{position:absolute;background-repeat:no-repeat;background-size:100% 100%;will-change:transform}
.bot .L-head{transform-origin:200px 330px}
.bot .L-arm{transform-origin:65px 23px;z-index:2}
.bot .L-bag{transform-origin:40px 20px}
.bot .L-blueprint{transform-origin:150px 150px}
.bot .hand{position:absolute;left:62px;top:96px;width:96px;height:96px;opacity:0;transform:scale(0);transform-origin:50% 60%}
.bot .dust{position:absolute;bottom:20px;width:70px;height:70px;border-radius:50%;background:#8a8a90;opacity:0}
.bot .dust.a{left:90px}.bot .dust.b{left:360px}
.bot.idle .go{animation:bob 3s ease-in-out infinite}
.bot.idle .L-head{animation:nod 3s ease-in-out infinite}
/* intro: runs in from the left, brakes, stops */
.bot.run .go{animation:runx 1.25s cubic-bezier(.2,.7,.3,1) both}
.bot.run .stage{animation:hop .21s ease-in-out 5, brake .35s ease-out 1.05s}
.bot.run .L-head{animation:headb .21s ease-in-out 5}
.bot.run .dust.a,.bot.run .dust.b{animation:puff .6s ease-out 1.05s}
/* right answer: head nods yes */
.bot.yes .L-head{animation:headyes 1.1s ease-in-out}
.bot.yes .stage{animation:cheer .5s ease-out .2s}
/* wrong answer: head shakes no */
.bot.no .L-head{animation:headno 1.1s ease-in-out}
.bot.no .stage{animation:droop 1.1s ease-in-out}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(1.2deg)}}
@keyframes runx{0%{transform:translateX(-135vw)}100%{transform:translateX(0)}}
@keyframes hop{0%,100%{transform:scale(var(--s)) translateY(0)}50%{transform:scale(var(--s)) translateY(-22px) rotate(2deg)}}
@keyframes headb{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
@keyframes brake{0%{transform:scale(var(--s)) skewX(0)}30%{transform:scale(var(--s)) skewX(-9deg) scaleY(.94)}70%{transform:scale(var(--s)) skewX(3deg) scaleY(1.03)}100%{transform:scale(var(--s)) skewX(0)}}
@keyframes puff{0%{opacity:.7;transform:scale(.3) translateX(0)}100%{opacity:0;transform:scale(1.5) translateX(-30px)}}
@keyframes dropbag{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-10px) rotate(-4deg)}100%{transform:translateY(520px) rotate(34deg);opacity:0}}
@keyframes dropbp{0%{transform:rotate(0)}25%{transform:rotate(-3deg)}100%{transform:translate(-90px,520px) rotate(-55deg);opacity:0}}
@keyframes droptool{0%{transform:translateY(0)}100%{transform:translate(-30px,540px) rotate(-90deg);opacity:0}}
@keyframes droptool2{0%{transform:translateY(0)}100%{transform:translate(30px,520px) rotate(80deg);opacity:0}}
@keyframes armup{to{transform:rotate(-105deg)}}
@keyframes handpop{0%{opacity:1;transform:rotate(105deg) scale(0)}100%{opacity:1;transform:rotate(105deg) scale(1.55)}}
@keyframes cheer{0%{transform:scale(var(--s)) translateY(0)}40%{transform:scale(var(--s)) translateY(-26px)}100%{transform:scale(var(--s)) translateY(0)}}
@keyframes headyes{0%,100%{transform:translateY(0) rotate(0)}12%{transform:translateY(16px) rotate(3deg)}28%{transform:translateY(-10px) rotate(-3deg)}44%{transform:translateY(16px) rotate(3deg)}60%{transform:translateY(-10px) rotate(-3deg)}76%{transform:translateY(12px) rotate(2deg)}90%{transform:translateY(-4px)}}
@keyframes headno{0%,100%{transform:rotate(0) translateX(0)}15%{transform:rotate(-13deg) translateX(-14px)}38%{transform:rotate(13deg) translateX(14px)}60%{transform:rotate(-10deg) translateX(-10px)}80%{transform:rotate(6deg) translateX(6px)}}
@keyframes droop{0%,100%{transform:scale(var(--s)) translateY(0)}50%{transform:scale(var(--s)) translateY(4px)}}

/* intro */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;text-align:center}
.rules{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px}
.chip{display:inline-block;min-width:64px;text-align:center;padding:1px 10px;border-radius:99px;font-weight:700;font-size:14px;margin-right:8px}
.chip.g{background:var(--gray)}
.chip.r{background:var(--red)}
.credit{display:flex;align-items:center;justify-content:center;padding-top:6px}
.credit img.gl{width:64px;height:auto}
.credit img.ai{width:44px;height:44px}
.credit p{font-size:14px;line-height:1.3;color:var(--muted)}
.credit b{display:block;color:var(--text);font-weight:600;font-size:15px}

/* quiz */
.top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px;color:var(--muted)}
.top .score{color:var(--text);font-variant-numeric:tabular-nums;position:relative}
.plus{position:absolute;right:0;top:-6px;font-weight:800;animation:plus 1s ease-out forwards}
.timer{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--muted);transform-origin:left;border-radius:99px}
.timer.low i{animation:pulse .5s ease-in-out infinite}
.q{font-size:25px;font-weight:800;line-height:1.2;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;min-height:66px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:600;line-height:1.3;transition:background-color .2s,border-color .2s,opacity .2s,transform .12s}
.opt:active{transform:scale(.98)}
.opt .k{flex:0 0 36px;height:36px;border-radius:12px;background:var(--bg);border:1px solid #3A3A3F;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.opt .t{flex:1;display:flex;flex-direction:column;gap:2px}
.opt .tag{font-size:14px;font-weight:700;display:none}
.opt.right{background:var(--gray);border-color:#9A9AA0;animation:pop .55s ease-out}
.opt.wrong{background:var(--red);border-color:#e0504d;animation:shake .55s ease-in-out}
.opt.right .tag,.opt.wrong .tag{display:block}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}
.opt.right .k,.opt.wrong .k{background:rgba(0,0,0,.28);border-color:transparent;color:var(--text)}
.fb{display:none;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;animation:rise .35s ease-out}
.fb.on{display:flex}
.fb .msg{font-size:21px;font-weight:800;line-height:1.2}
.fb .why{color:var(--muted);font-size:16px}
#app.shake{animation:shakeApp .5s ease-in-out}

/* result */
.score-big{font-size:76px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;animation:slam .6s cubic-bezier(.3,1.6,.5,1)}
.center{text-align:center}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
#rain span{position:absolute;top:-48px;font-size:30px;animation:fall 1.7s ease-in forwards}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.07) rotate(-1.5deg)}55%{transform:scale(.97) rotate(1deg)}100%{transform:scale(1) rotate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-14px) rotate(-1deg)}30%{transform:translateX(12px) rotate(1deg)}45%{transform:translateX(-10px)}60%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
@keyframes shakeApp{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes plus{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-14px) scale(1.3)}100%{opacity:0;transform:translateY(-38px) scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slam{0%{transform:scale(2.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">

  <section id="intro" class="screen on">
    <div class="hero">
      <div class="bot run" id="introBot" data-mood="neutral" aria-hidden="true"></div>
      <h1>When should we use AI?</h1>
      <p class="muted">3 questions. 20 seconds each. Pick fast.</p>
      <div class="rules">
        <div><span class="chip g">Gray</span>right answer</div>
        <div><span class="chip r">Red</span>wrong answer</div>
      </div>
      <button class="btn" id="start" type="button">Start</button>

<script>
(function(){
  var QS=[
    {q:'Which task is best to hand to AI first?',
     o:['Final structural member sizing','Batch-renaming 200 sheets','Code-compliance sign-off','Choosing the project’s spatial concept'],
     c:1,why:'Batch work is repetitive and easy to check. Structure, code and concept stay with you.'},
    {q:'Which test tells you AI is a good fit for a task?',
     o:['The task is trending online','The task is long','You can verify the result faster than you could produce it','Nobody else in the studio does it'],
     c:2,why:'If checking is faster than doing, AI saves you time. If not, do it yourself.'},
    {q:'An AI-generated facade image is…',
     o:['A buildable design','Ideation that still needs structure, code and climate resolved','A construction drawing','A replacement for a model'],
     c:1,why:'It is a starting point. Someone still has to resolve structure, code and climate.'}
  ];
  var RIGHT=['Correct! The architect is proud.','Nailed it. Your jury is jealous.','Gray means go. Well done.','Brain 1, chatbot 0.'];
  var WRONG=['Nope. Even the architect shook his head.','Bold choice. Wrong, but bold.','The jury would like a word.','Error 404: right answer not found.','Your render crashed. Reboot your brain.'];
  var LATE=['Too slow. The AI finished 10 seconds ago.','Time is up. Still loading… still loading…'];
  var RES=[
    ['The AI Wrote This Score','Zero. Random guessing does better. Play again.'],
    ['Still Rendering by Hand','Respect for the craft, but the deadline will not wait.'],
    ['Almost a Prompt Engineer','One slip. The jury would have noticed it.'],
    ['AI Whisperer','You know exactly when to press the button.']
  ];
  var DUR=20000, RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S={screen:'intro',qi:0,score:0,answered:false};
  var raf=0,t0=0;
  function $(s){return document.querySelector(s)}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}

  var BOT='<div class="go"><i class="shadow"></i><div class="stage"><i class="L L-blueprint"></i><i class="L L-toolsL_ext"></i><i class="L L-toolsR_ext"></i><i class="L L-body"></i><i class="L L-arm"><svg class="hand" viewBox="0 0 100 100"><g stroke="#3E2A1B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="#FBD3B0"><rect x="24" y="46" width="52" height="40" rx="14"/><path d="M38 50 V24 a9 9 0 0 1 18 0 V40 h12 a8 8 0 0 1 0 16 H38 Z" transform="translate(0,0)"/><path d="M34 62 h30 M34 72 h26" fill="none" stroke-width="4"/></g></svg></i><i class="L L-toolsL"></i><i class="L L-toolsR"></i><i class="L L-bag"></i><i class="L L-head"></i><i class="dust a"></i><i class="dust b"></i></div></div>';
  document.querySelectorAll('.bot').forEach(function(b){b.innerHTML=BOT});
  (function(){var ib=document.getElementById('introBot');if(ib){ib.addEventListener('animationend',function(e){if(e.target===ib.querySelector('.go')&&ib.classList.contains('run')){ib.classList.remove('run');ib.classList.add('idle')}})}})();

  function show(n){
    S.screen=n;
    ['intro','quiz','result'].forEach(function(id){$('#'+id).classList.toggle('on',id===n)});
    window.scrollTo(0,0);
  }
  function mood(el,m,cls){
    el.dataset.mood=m;
    el.classList.remove('run','yes','no','idle');
    void el.offsetWidth;
    var map={jump:'yes',flop:'no',idle:'idle',run:'run'};
    if(cls){ if(RM&&cls!=='idle'){el.classList.add(cls==='jump'?'yes':'no');el.style.setProperty('--rm','1')} else el.classList.add(map[cls]) }
  }

  function renderQ(){
    var q=QS[S.qi]; S.answered=false;
    $('#prog').textContent='Question '+(S.qi+1)+' of '+QS.length;
    $('#score').textContent=S.score;
    $('#qtext').textContent=q.q;
    var box=$('#opts'); box.innerHTML='';
    q.o.forEach(function(txt,i){
      var b=document.createElement('button'); b.type='button'; b.className='opt'; b.id='opt'+i;
      var k=document.createElement('span'); k.className='k'; k.textContent='ABCD'[i];
      var t=document.createElement('span'); t.className='t';
      var s1=document.createElement('span'); s1.textContent=txt;
      var s2=document.createElement('span'); s2.className='tag';
      t.appendChild(s1); t.appendChild(s2); b.appendChild(k); b.appendChild(t);
      b.addEventListener('click',function(){answer(i)});
      box.appendChild(b);
    });
    $('#fb').classList.remove('on');
    mood($('#quizBot'),'neutral','idle');
    show('quiz');
    startTimer();
  }

  function startTimer(){
    cancelAnimationFrame(raf);
    var bar=$('#bar'), tm=$('#timer');
    tm.classList.remove('low'); bar.style.transform='scaleX(1)';
    t0=performance.now();
    (function tick(){
      var el=performance.now()-t0, f=Math.max(0,1-el/DUR);
      bar.style.transform='scaleX('+f+')';
      if(f<0.25) tm.classList.add('low');
      if(el>=DUR){answer(-1);return}
      raf=requestAnimationFrame(tick);
    })();
  }

  function answer(i){
    if(S.answered) return;
    S.answered=true; cancelAnimationFrame(raf);
    $('#timer').classList.remove('low');
    var q=QS[S.qi], ok=(i===q.c), late=(i===-1);
    var btns=document.querySelectorAll('.opt');
    btns.forEach(function(b,idx){
      b.disabled=true;
      if(idx===q.c){b.classList.add('right');b.querySelector('.tag').textContent='✓ Right answer'}
      else if(idx===i){b.classList.add('wrong');b.querySelector('.tag').textContent='✗ Not this one'}
      else b.classList.add('dim');
    });
    var bot=$('#quizBot');
    if(ok){
      S.score++; $('#score').textContent=S.score;
      var p=document.createElement('span'); p.className='plus'; p.textContent='+1';
      $('#plusSlot').innerHTML=''; $('#plusSlot').appendChild(p);
      mood(bot,'happy','jump');
      var r=btns[q.c].getBoundingClientRect(); confetti(r.left+r.width/2,r.top+r.height/2);
      $('#msg').textContent=pick(RIGHT);
    } else {
      mood(bot,'dead','flop');
      shakeApp(); rain();
      try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
      $('#msg').textContent=pick(late?LATE:WRONG);
    }
    $('#why').textContent=q.why;
    $('#next').textContent=(S.qi===QS.length-1)?'See my score':'Next question';
    var fb=$('#fb'); fb.classList.add('on');
    setTimeout(function(){try{fb.scrollIntoView({behavior:RM?'auto':'smooth',block:'end'})}catch(e){}},120);
  }

  function next(){
    if(S.qi<QS.length-1){S.qi++;renderQ()} else finish();
  }
  function finish(){
    var n=S.score;
    $('#final').textContent=n+' / '+QS.length;
    $('#rtitle').textContent=RES[n][0];
    $('#rline').textContent=RES[n][1];
    var b=$('#resBot');
    mood(b,n>=2?'happy':(n===0?'dead':'neutral'),n>=2?'jump':'flop');
    show('result');
    if(n===QS.length) setTimeout(function(){confetti(innerWidth/2,innerHeight*0.3,140)},200);
    if(n===0) rain();
  }
  function restart(){S.qi=0;S.score=0;renderQ()}

  function shakeApp(){
    if(RM) return;
    var a=$('#app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
    setTimeout(function(){a.classList.remove('shake')},550);
  }
  function rain(){
    if(RM) return;
    var box=$('#rain'), em=['💥','🤦','🤖','💀','🔥'];
    for(var i=0;i<9;i++){
      var s=document.createElement('span');
      s.textContent=pick(em);
      s.style.left=(Math.random()*92)+'%';
      s.style.animationDelay=(Math.random()*0.5)+'s';
      s.style.setProperty('--r',(Math.random()*720-360)+'deg');
      box.appendChild(s);
      (function(el){setTimeout(function(){el.remove()},2400)})(s);
    }
  }
  function confetti(x,y,n){
    if(RM) return;
    var c=$('#fx'), g=c.getContext('2d');
    c.width=innerWidth; c.height=innerHeight;
    var cols=['#F5F5F7','#A1A1A6','#6E6E74','#FFFFFF'], P=[], N=n||70;
    for(var i=0;i<N;i++){
      var a=Math.random()*Math.PI*2, v=4+Math.random()*9;
      P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.5,c:pick(cols),e:Math.random()<.12?'🤖':null});
    }
    var t=performance.now();
    (function f(){
      var el=performance.now()-t;
      g.clearRect(0,0,c.width,c.height);
      P.forEach(function(p){
        p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
        g.globalAlpha=Math.max(0,1-el/1700);
        g.save(); g.translate(p.x,p.y); g.rotate(p.r);
        if(p.e){g.font='22px sans-serif';g.fillText(p.e,-11,8)}
        else{g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
        g.restore();
      });
      if(el<1700) requestAnimationFrame(f); else g.clearRect(0,0,c.width,c.height);
    })();
  }

  $('#start').addEventListener('click',function(){S.qi=0;S.score=0;renderQ()});
  $('#next').addEventListener('click',next);
  $('#again').addEventListener('click',restart);

  var hot=window.claude&&window.claude.hot;
  if(hot&&hot.snapshot) hot.snapshot(function(){return {screen:S.screen,qi:S.qi,score:S.score}});
  function boot(d){
    d=d||{};
    if(d.screen==='quiz'){S.qi=d.qi||0;S.score=d.score||0;renderQ()}
    else if(d.screen==='result'){S.score=d.score||0;finish()}
    else show('intro');
  }
  if(hot&&hot.ready) hot.ready(boot); else boot((hot&&hot.data)||{});
})();
</script>
